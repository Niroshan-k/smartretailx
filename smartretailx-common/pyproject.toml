[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartretailx-common"
version = "0.1.0"
description = "Shared library for SmartRetailX Microservices"
authors = [{name = "SmartRetailX Team"}]
dependencies = [
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
