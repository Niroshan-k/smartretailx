name: SmartRetailX AWS CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: smartretailx-cluster

jobs:
  build-and-deploy:
    name: Build, Push ECR Images & Deploy to AWS EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Container Images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("auth-service" "user-service" "catalog-service" "inventory-service" "payment-service" "order-service")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building $SERVICE with tags: $IMAGE_TAG and latest..."
            docker build -t $ECR_REGISTRY/smartretailx/$SERVICE:$IMAGE_TAG -t $ECR_REGISTRY/smartretailx/$SERVICE:latest -f smartretailx-$SERVICE/Dockerfile .
            docker push $ECR_REGISTRY/smartretailx/$SERVICE:$IMAGE_TAG
            docker push $ECR_REGISTRY/smartretailx/$SERVICE:latest
          done

          echo "Building API Gateway..."
          docker build -t $ECR_REGISTRY/smartretailx/gateway:$IMAGE_TAG -t $ECR_REGISTRY/smartretailx/gateway:latest -f smartretailx-gateway/Dockerfile smartretailx-gateway/
          docker push $ECR_REGISTRY/smartretailx/gateway:$IMAGE_TAG
          docker push $ECR_REGISTRY/smartretailx/gateway:latest

      - name: Update Kubernetes Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests & Restart Deployments in EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment auth-service user-service catalog-service inventory-service payment-service order-service gateway
          kubectl rollout status deployment/auth-service --timeout=120s
          kubectl rollout status deployment/user-service --timeout=120s
          kubectl rollout status deployment/catalog-service --timeout=120s
          kubectl rollout status deployment/inventory-service --timeout=120s
          kubectl rollout status deployment/payment-service --timeout=120s
          kubectl rollout status deployment/order-service --timeout=120s
