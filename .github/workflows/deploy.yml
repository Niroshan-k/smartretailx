name: SmartRetailX AWS CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'diagram/**'

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: smartretailx-cluster

jobs:
  build-and-deploy:
    name: Build, Push ECR Images & Deploy to AWS EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Container Images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("auth-service" "user-service" "catalog-service" "inventory-service" "payment-service" "order-service" "gateway")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building $SERVICE with tags: $IMAGE_TAG and latest..."
            if [ "$SERVICE" = "gateway" ]; then
              docker build -t $ECR_REGISTRY/smartretailx/$SERVICE:$IMAGE_TAG -t $ECR_REGISTRY/smartretailx/$SERVICE:latest -f smartretailx-gateway/Dockerfile smartretailx-gateway/
            else
              docker build -t $ECR_REGISTRY/smartretailx/$SERVICE:$IMAGE_TAG -t $ECR_REGISTRY/smartretailx/$SERVICE:latest -f smartretailx-$SERVICE/Dockerfile .
            fi
            docker push $ECR_REGISTRY/smartretailx/$SERVICE:$IMAGE_TAG
            docker push $ECR_REGISTRY/smartretailx/$SERVICE:latest
          done

      - name: Update Kubeconfig & Synchronize AWS Secrets Manager into EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

          SECRET_ARN=$(aws secretsmanager list-secrets --query "SecretList[?starts_with(Name, 'smartretailx/')].Name" --output text | head -n 1)
          if [ -n "$SECRET_ARN" ]; then
            echo "Fetching database credentials from AWS Secrets Manager ($SECRET_ARN)..."
            SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text)
            USER_DB_URL=$(echo $SECRET_JSON | jq -r '.USER_DB_URL // "postgresql://user_admin:user_pass@localhost:5432/user_db"')
            CATALOG_DB_URL=$(echo $SECRET_JSON | jq -r '.CATALOG_DB_URL // "postgresql://catalog_admin:catalog_pass@localhost:5432/catalog_db"')
            INVENTORY_DB_URL=$(echo $SECRET_JSON | jq -r '.INVENTORY_DB_URL // "postgresql://inventory_admin:inventory_pass@localhost:5432/inventory_db"')
            PAYMENT_DB_URL=$(echo $SECRET_JSON | jq -r '.PAYMENT_DB_URL // "postgresql://payment_admin:payment_pass@localhost:5432/payment_db"')
            ORDER_DB_URL=$(echo $SECRET_JSON | jq -r '.ORDER_DB_URL // "postgresql://order_admin:order_pass@localhost:5432/order_db"')
            AUTH_DB_URL=$(echo $SECRET_JSON | jq -r '.AUTH_DB_URL // "postgresql://auth_admin:auth_pass@localhost:5432/auth_db"')
          else
            USER_DB_URL="postgresql://user_admin:user_pass@localhost:5432/user_db"
            CATALOG_DB_URL="postgresql://catalog_admin:catalog_pass@localhost:5432/catalog_db"
            INVENTORY_DB_URL="postgresql://inventory_admin:inventory_pass@localhost:5432/inventory_db"
            PAYMENT_DB_URL="postgresql://payment_admin:payment_pass@localhost:5432/payment_db"
            ORDER_DB_URL="postgresql://order_admin:order_pass@localhost:5432/order_db"
            AUTH_DB_URL="postgresql://auth_admin:auth_pass@localhost:5432/auth_db"
          fi

          kubectl create secret generic db-secrets \
            --from-literal=USER_DB_URL="$USER_DB_URL" \
            --from-literal=CATALOG_DB_URL="$CATALOG_DB_URL" \
            --from-literal=INVENTORY_DB_URL="$INVENTORY_DB_URL" \
            --from-literal=PAYMENT_DB_URL="$PAYMENT_DB_URL" \
            --from-literal=ORDER_DB_URL="$ORDER_DB_URL" \
            --from-literal=AUTH_DB_URL="$AUTH_DB_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Manifest Image Paths & Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("auth-service" "user-service" "catalog-service" "inventory-service" "payment-service" "order-service")
          for SERVICE in "${SERVICES[@]}"; do
            sed -i "s|image: smartretailx/$SERVICE:latest|image: $ECR_REGISTRY/smartretailx/$SERVICE:$IMAGE_TAG|g" k8s/$SERVICE.yaml
          done
          sed -i "s|image: smartretailx/gateway:latest|image: $ECR_REGISTRY/smartretailx/gateway:$IMAGE_TAG|g" k8s/gateway-service.yaml

          kubectl apply -f k8s/
          kubectl rollout status deployment/auth-service --timeout=300s
          kubectl rollout status deployment/user-service --timeout=300s
          kubectl rollout status deployment/catalog-service --timeout=300s
          kubectl rollout status deployment/inventory-service --timeout=300s
          kubectl rollout status deployment/payment-service --timeout=300s
          kubectl rollout status deployment/order-service --timeout=300s
          kubectl rollout status deployment/gateway-service --timeout=300s
          kubectl rollout status deployment/kafka-service --timeout=300s
