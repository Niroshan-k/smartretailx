services:
  # Databases (Database-per-service isolation)
  user_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: user_password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d user_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - user_db_data:/var/lib/postgresql/data

  catalog_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: catalog_admin
      POSTGRES_PASSWORD: catalog_password
      POSTGRES_DB: catalog_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_admin -d catalog_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - catalog_db_data:/var/lib/postgresql/data

  inventory_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: inventory_admin
      POSTGRES_PASSWORD: inventory_password
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_admin -d inventory_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - inventory_db_data:/var/lib/postgresql/data

  payment_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: payment_admin
      POSTGRES_PASSWORD: payment_password
      POSTGRES_DB: payment_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_admin -d payment_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - payment_db_data:/var/lib/postgresql/data

  order_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: order_password
      POSTGRES_DB: order_db
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_admin -d order_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - order_db_data:/var/lib/postgresql/data

  # Kafka Event Stream (Redpanda)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "19644:19644"

  # Microservices
  user-service:
    build:
      context: .
      dockerfile: smartretailx-user-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://user_admin:user_password@user_db:5432/user_db
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      user_db:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: smartretailx-catalog-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://catalog_admin:catalog_password@catalog_db:5432/catalog_db
      - PORT=8002
    ports:
      - "8002:8002"
    depends_on:
      catalog_db:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: smartretailx-inventory-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://inventory_admin:inventory_password@inventory_db:5432/inventory_db
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - PORT=8003
    ports:
      - "8003:8003"
    depends_on:
      inventory_db:
        condition: service_healthy
      redpanda:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: smartretailx-payment-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://payment_admin:payment_password@payment_db:5432/payment_db
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - PORT=8004
    ports:
      - "8004:8004"
    depends_on:
      payment_db:
        condition: service_healthy
      redpanda:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: smartretailx-order-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://order_admin:order_password@order_db:5432/order_db
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - PAYMENT_SERVICE_URL=http://payment-service:8004
      - PORT=8005
    ports:
      - "8005:8005"
    depends_on:
      order_db:
        condition: service_healthy
      redpanda:
        condition: service_started
      payment-service:
        condition: service_started

  # API Gateway
  gateway:
    build:
      context: ./smartretailx-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - catalog-service
      - inventory-service
      - payment-service
      - order-service

volumes:
  user_db_data:
  catalog_db_data:
  inventory_db_data:
  payment_db_data:
  order_db_data:
